<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="../static/style.css">

</head>

<body>
    <nav class="navbar">

        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/estoque">Movimentação</a></li>
        </ul>
    </nav>

    <main id="form_container">

        <div id="form_header">
            <h1 id="form_title">
                Criar conta
            </h1>
        </div>

        <form action="">

            <div id="input_container">

                <div class="input-box">
                    <label for="name" class="form-label">
                        Primeiro nome
                    </label>

                    <div class="input-field">
                        <input
                            type="text"
                            name="name"
                            id="name"
                            class="form-control"
                            >
                    </div>
                </div>

                <div class="input-box">
                    <label for="last_name" class="form-label">
                        Sobrenome
                    </label>

                    <div class="input-field">
                        <input
                            type="text"
                            name="last_name"
                            id="last_name"
                            class="form-control"
                            >
                    </div>
                </div>

                <div class="input-box">
                    <label for="birthdate" class="form-label">
                        Nascimento
                    </label>

                    <div class="input-field">
                        <input
                            type="text"
                            name="birthdate"
                            id="birthdate"
                            class="form-control">
                    </div>
                </div>

                <div class="input-box">
                    <label for="email" class="form-label">
                        E-mail
                    </label>

                    <div class="input-field">
                        <input
                            type="email"
                            name="email"
                            id="email"
                            class="form-control"
                            >
                    </div>
                </div>

                <div class="input-box">
                    <label for="password" class="form-label">
                        Senha
                    </label>

                    <div class="input-field">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                           >
                    </div>
                </div>

                <div class="input-box">
                    <label for="confirm_password" class="form-label">
                        Confirmar senha
                    </label>

                    <div class="input-field">
                        <input
                            type="password"
                            name="confirm_password"
                            id="confirm_password"
                            class="form-control"
                            >
                    </div>
                </div>

                <div class="radio-container">

                    <label class="form-label">Tipo de usuário</label>

                    <div id="gender_inputs">

                        <div class="radio-box">
                            <input
                                type="radio"
                                name="gender"
                                id="admin"
                                value="admin">

                            <label for="admin" class="form-label">
                                Administrador
                            </label>
                        </div>

                        <div class="radio-box">
                            <input
                                type="radio"
                                name="gender"
                                id="user"
                                value="user">

                            <label for="user" class="form-label">
                                Usuário
                            </label>
                        </div>

                    </div>

                </div>

            </div>

            <button type="submit" class="btn-default">
                Cadastrar
            </button>

        </form>

    </main>

    <script src="../static/script.js"></script>

</body>

</html>
